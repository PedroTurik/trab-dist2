name: lab-etcd

# Adaptado do lab-compose.zip. Mudancas (documentadas no relatorio):
#  - etcd v3.5.14 -> v3.7.3 (versao estavel atual)
#  - parametros de Raft explicitos (iguais aos defaults) e compactacao automatica
#    (evita estourar a quota do backend durante as rodadas longas do E1)
#  - cpuset fixo por no (4 CPUs logicas = 2 nucleos P cada) e gerador em CPUs separadas
#  - gerador: binario Go estatico (gerador/bin/gerador) em alpine, em vez de python
x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.7.3
  environment: &etcd-env
    ETCD_DATA_DIR: /data
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_INITIAL_CLUSTER_TOKEN: lab
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER: n1=http://172.30.0.11:2380,n2=http://172.30.0.12:2380,n3=http://172.30.0.13:2380
    ETCD_HEARTBEAT_INTERVAL: "100"      # ms (default)
    ETCD_ELECTION_TIMEOUT: "1000"       # ms (default)
    ETCD_SNAPSHOT_COUNT: "10000"        # default
    ETCD_AUTO_COMPACTION_MODE: periodic
    ETCD_AUTO_COMPACTION_RETENTION: 1m
    ETCD_QUOTA_BACKEND_BYTES: "8589934592"
    # fsync do WAL ligado (default; --unsafe-no-fsync NAO e usado)

services:
  n1:
    <<: *etcd
    container_name: n1
    cpuset: "0-3"
    environment:
      <<: *etcd-env
      ETCD_NAME: n1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.30.0.11:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.31.0.11:2379
    networks:
      cluster:
        ipv4_address: 172.30.0.11
      clientes:
        ipv4_address: 172.31.0.11

  n2:
    <<: *etcd
    container_name: n2
    cpuset: "4-7"
    environment:
      <<: *etcd-env
      ETCD_NAME: n2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.30.0.12:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.31.0.12:2379
    networks:
      cluster:
        ipv4_address: 172.30.0.12
      clientes:
        ipv4_address: 172.31.0.12

  n3:
    <<: *etcd
    container_name: n3
    cpuset: "8-11"
    environment:
      <<: *etcd-env
      ETCD_NAME: n3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.30.0.13:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.31.0.13:2379
    networks:
      cluster:
        ipv4_address: 172.30.0.13
      clientes:
        ipv4_address: 172.31.0.13

  gerador:
    image: alpine:3.22
    container_name: gerador
    user: "1000:1000"
    cpuset: "12-27"
    working_dir: /app
    volumes:
      - ./gerador:/app
      - ./resultados:/resultados
    command: sleep infinity
    networks:
      clientes:
        ipv4_address: 172.31.0.100


networks:
  cluster:
    name: lab_cluster
    ipam:
      config:
        - subnet: 172.30.0.0/24
  clientes:
    name: lab_clientes
    ipam:
      config:
        - subnet: 172.31.0.0/24
